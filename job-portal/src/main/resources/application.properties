app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_2ubbH3pxLXqjjlGGMvCS9qAT0k0Wh7Ho}
app.stripe.prices.recruiter-growth=${STRIPE_PRICE_RECRUITER_GROWTH:price_1UYJoq4zktYRu2zyPac0d1J9}
